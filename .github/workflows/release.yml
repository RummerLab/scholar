name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Require a version tag
    runs-on: ubuntu-latest
    steps:
      - name: Reject branches and non-version tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    uses: ./.github/workflows/images.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write

  publish:
    name: Publish multi-platform release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble tested AMD64 and ARM64 images
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          for name in "$image" "$image-cron"; do
            docker buildx imagetools create --tag "$name:$RELEASE_TAG" \
              "$name:$RELEASE_TAG-amd64" "$name:$RELEASE_TAG-arm64"
          done
      - name: Create GitHub release after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
      - name: Update Watchtower latest tags after release publication
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          for name in "$image" "$image-cron"; do
            docker buildx imagetools create --tag "$name:latest" "$name:$RELEASE_TAG"
          done
