name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Configure requests cache
        run: mkdir -p cache

      - name: Run tests
        run: python -m pytest tests/ -m "not integration and not credentials" --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

  smoke:
    name: Production Docker smoke
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ inputs.ref }}

  release-checks:
    name: Release checks
    if: always()
    needs: [lint, test, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          test "$LINT" = success
          test "$TEST" = success
          test "$SMOKE" = success
