services:
    web:
        image: ghcr.io/rummerlab/scholar:${SCHOLAR_IMAGE_TAG:-latest}
        labels:
            com.centurylinklabs.watchtower.enable: 'true'
        container_name: scholar_web
        env_file: .env
        environment:
            - PYTHONUNBUFFERED=1
        ports:
            - '8000:5000'
        volumes:
            - scholar_data:/app/scholar_data
            - cache:/app/cache
            - downloaded_files:/app/downloaded_files
            - ./google-credentials.json:/app/google-credentials.json:ro
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
            interval: 30s
            timeout: 10s
            retries: 3

    cron:
        image: ghcr.io/rummerlab/scholar-cron:${SCHOLAR_IMAGE_TAG:-latest}
        labels:
            com.centurylinklabs.watchtower.enable: 'true'
        container_name: scholar_cron
        env_file: .env
        environment:
            - PYTHONUNBUFFERED=1
        volumes:
            - scholar_data:/app/scholar_data
            - cache:/app/cache
            - downloaded_files:/app/downloaded_files
            - ./google-credentials.json:/app/google-credentials.json:ro
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'
        restart: unless-stopped
        depends_on:
            web:
                condition: service_healthy

volumes:
    scholar_data:
    cache:
    downloaded_files:
